<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغيّر الصوت</title>
<style>
:root{
  --bg:#f5f3ff; --card:#ffffff; --text:#1f1b2e; --muted:#6b6478;
  --accent:#8b5cf6; --accent2:#ec4899; --ring:#e9e4fb;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121f; --card:#1f1b2e; --text:#f4f1fb; --muted:#a79fc0;
    --accent:#a78bfa; --accent2:#f472b6; --ring:#332b4d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15121f; --card:#1f1b2e; --text:#f4f1fb; --muted:#a79fc0;
  --accent:#a78bfa; --accent2:#f472b6; --ring:#332b4d;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  display:flex; justify-content:center;
  padding: calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));
}
.wrap{width:100%; max-width:420px;}
h1{font-size:1.4rem; text-align:center; margin:0 0 4px;}
p.sub{color:var(--muted); text-align:center; margin:0 0 20px; font-size:0.92rem; line-height:1.6;}
.card{background:var(--card); border-radius:20px; padding:20px; box-shadow:0 8px 24px rgba(0,0,0,0.08); margin-bottom:16px;}
.voices{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:18px;}
.voice-btn{
  border:2px solid var(--ring); background:transparent; color:var(--text);
  border-radius:14px; padding:14px 6px; font-size:0.85rem; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  transition:.15s;
}
.voice-btn .emoji{font-size:1.6rem;}
.voice-btn.active{border-color:var(--accent); background:var(--ring); font-weight:600;}
#mainBtn{
  width:100%; padding:16px; border:none; border-radius:16px; font-size:1.05rem; font-weight:700;
  color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); cursor:pointer;
}
#mainBtn:disabled{opacity:.6;}
#status{text-align:center; margin-top:14px; font-size:0.85rem; color:var(--muted); min-height:1.2em;}
.warn{background:var(--ring); border-radius:14px; padding:12px 14px; font-size:0.82rem; color:var(--muted); line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ مغيّر الصوت</h1>
  <p class="sub">اختر الصوت، اضغط "ابدأ"، وتحدّث في المايكروفون — صوتك يخرج معدّلاً فوراً.</p>

  <div class="card">
    <div class="voices">
      <button class="voice-btn" data-pitch="8" data-label="طفل">
        <span class="emoji">👶</span>طفل صغير
      </button>
      <button class="voice-btn active" data-pitch="4.5" data-label="فتاة">
        <span class="emoji">👧</span>فتاة
      </button>
      <button class="voice-btn" data-pitch="-5" data-label="رجل مسن">
        <span class="emoji">👴</span>رجل مسن
      </button>
    </div>
    <button id="mainBtn">ابدأ</button>
    <div id="status">اضغط ابدأ وامنح إذن المايكروفون</div>
  </div>

  <div class="warn">
    ⚠️ استخدم سماعات الرأس (هيدفون) لتفادي صدى الصوت (الصوت الراجع من السماعة للمايكروفون). بدون سماعات قد يحدث صدى مزعج.
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
let pitchShift, mic, running = false;
let currentPitch = 4.5;

document.querySelectorAll('.voice-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.voice-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentPitch = parseFloat(btn.dataset.pitch);
    if(pitchShift) pitchShift.pitch = currentPitch;
  });
});

const mainBtn = document.getElementById('mainBtn');
const status = document.getElementById('status');

mainBtn.addEventListener('click', async ()=>{
  if(!running){
    mainBtn.disabled = true;
    status.textContent = 'جارٍ طلب إذن المايكروفون...';
    try{
      await Tone.start();
      mic = new Tone.UserMedia();
      await mic.open();
      pitchShift = new Tone.PitchShift({ pitch: currentPitch, windowSize: 0.12 });
      const warmth = new Tone.EQ3({ low: -2, mid: 1, high: 3 });
      const smoother = new Tone.Chorus({ frequency: 0.8, delayTime: 2, depth: 0.25, wet: 0.18 }).start();
      mic.connect(pitchShift);
      pitchShift.connect(warmth);
      warmth.connect(smoother);
      smoother.toDestination();
      running = true;
      mainBtn.textContent = 'إيقاف';
      status.textContent = 'يعمل الآن — تحدّث بصوت عادي';
    }catch(err){
      status.textContent = 'تعذّر الوصول للمايكروفون. تحقق من الأذونات.';
    }
    mainBtn.disabled = false;
  } else {
    if(mic) mic.close();
    if(pitchShift) pitchShift.dispose();
    running = false;
    mainBtn.textContent = 'ابدأ';
    status.textContent = 'تم الإيقاف';
  }
});
</script>
</body>
</html>
